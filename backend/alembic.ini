# Alembic Configuration for StockMate
# Owner: TV1 - Phuoc

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL mac dinh cho dev; env.py se uu tien lay tu bien moi truong DATABASE_URL hoac file .env
sqlalchemy.url = postgresql+psycopg://postgres:h%%24c4122005@localhost:5432/stock_exchange

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
