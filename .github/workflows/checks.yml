name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mobile_checks:
        description: 'Run checks on the original Flutter code (TV2 resolves existing lints)'
        required: false
        default: false
        type: boolean

jobs:
  preparation:
    name: Skeleton, documentation and ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        - run: python -m pip install ruff==0.17.2
      - run: python -m ruff check backend/app backend/scripts backend/tests backend/alembic
      - run: python -m ruff format --check backend/app backend/scripts backend/tests backend/alembic
      - run: python -m compileall -q backend/app backend/scripts backend/tests backend/alembic
      # TODO(ENV-01/QA-01): add DB migration, seed, API tests and OpenAPI checks
      # after the owners implement them. Green here verifies preparation only.
  mobile:
    name: Original Flutter code (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_mobile_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
