name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockmate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d stockmate_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockmate_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockmate_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check app scripts tests alembic
      - run: python -m ruff format --check app scripts tests alembic
      - run: python -m alembic upgrade head
      - run: python -m scripts.seed_demo
      - run: python -m pytest -q
      - run: python -m scripts.export_openapi --check
      - run: python scripts/check_preparation.py
        working-directory: .
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
