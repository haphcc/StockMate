name: stockmate
description: StockMate - ung dung giao dich chung khoan (HOSE/HNX/UPCOM)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Dieu huong
  go_router: ^18.0.1

  # Goi API FastAPI
  dio: ^5.9.0

  # Luu JWT an toan (Keychain tren iOS, EncryptedSharedPreferences tren Android)
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3

  # Bieu do gia
  fl_chart: ^1.2.0

  # Dinh dang so / ngay theo locale vi_VN
  intl: ^0.20.3

  # Tien ich
  equatable: ^2.1.0
  
  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
